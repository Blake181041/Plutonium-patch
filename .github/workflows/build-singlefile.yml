name: Build Plutonium single-file

on:
  push:
    branches:
      - main
    paths-ignore:
      - "dist-single/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plutonium-singlefile
  cancel-in-progress: true

jobs:
  build-single-html:
    name: Build Single-File HTML
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Build Single-File HTML
        run: npm run build:single

      - name: Validate build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-single/plutonium.html
          test -s dist-single/plutonium.svg
          grep -q '<!DOCTYPE html\|<html' dist-single/plutonium.html
          grep -q '<svg' dist-single/plutonium.svg
          printf 'HTML: '
          du -h dist-single/plutonium.html | cut -f1
          printf 'SVG:  '
          du -h dist-single/plutonium.svg | cut -f1

      - name: Upload Single-File build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plutonium-SingleFile
          path: dist-single/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-single/plutonium.html dist-single/plutonium.svg
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git commit -m "build: update Plutonium single-file outputs [skip ci]"
          git push
