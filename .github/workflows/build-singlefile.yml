name: Build Plutonium single-file

on:
  push:
    branches:
      - main
    paths-ignore:
      - "dist-single/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plutonium-singlefile
  cancel-in-progress: true

jobs:
  build-single-html:
    name: Build Single-File HTML
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Set Chromium path
        shell: bash
        run: |
          echo "PLUTONIUM_BROWSER=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Build Single-File HTML
        run: npm run build:single

      - name: Embed onboarding into Single-File build
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/plutonium-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          node node_modules/single-file-cli/single-file-node.js \
            http://127.0.0.1:4173/onboarding.html \
            dist-single/onboarding-embedded.html \
            --browser-executable-path="$PLUTONIUM_BROWSER" \
            --browser-arg="--no-sandbox" \
            --browser-arg="--disable-dev-shm-usage"

          node <<'NODE'
          const fs = require('fs');

          const mainPath = 'dist-single/plutonium.html';
          const onboardingPath = 'dist-single/onboarding-embedded.html';

          let main = fs.readFileSync(mainPath, 'utf8');
          let onboarding = fs.readFileSync(onboardingPath, 'utf8');

          const returnPattern = /location\.replace\(\s*(['"])index\.html\1\s*\)/g;
          const returnReplacement = 'window.parent.postMessage({type:"plu-single-onboarding-done"},"*")';

          if (!returnPattern.test(onboarding)) {
            throw new Error('Could not find onboarding return navigation in embedded onboarding build.');
          }

          onboarding = onboarding.replace(returnPattern, returnReplacement);

          const onboardingB64 = Buffer.from(onboarding, 'utf8').toString('base64');

          const redirectPattern = /location\.replace\(\s*(['"])onboarding\.html\1\s*\)/g;
          if (!redirectPattern.test(main)) {
            throw new Error('Could not find onboarding redirect in generated Single-File HTML.');
          }

          main = main.replace(
            redirectPattern,
            'window.__pluOpenEmbeddedOnboarding()'
          );

          const bridge = [
            '<script>',
            '(() => {',
            'const embeddedOnboarding = "' + onboardingB64 + '";',
            'let frame = null;',
            'window.__pluOpenEmbeddedOnboarding = () => {',
            'if (frame) return;',
            "frame = document.createElement('iframe');",
            "frame.title = 'Plutonium onboarding';",
            "frame.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;border:0;z-index:2147483647;background:#000;';",
            'frame.srcdoc = atob(embeddedOnboarding);',
            'window.addEventListener("message", (event) => {',
            'if (event.source !== frame.contentWindow) return;',
            'if (!event.data || event.data.type !== "plu-single-onboarding-done") return;',
            'frame.remove();',
            'frame = null;',
            '});',
            'document.body.appendChild(frame);',
            '};',
            '})();',
            '</script>'
          ].join('');
          
          main = main.replace('</head>', bridge + '</head>');

          fs.writeFileSync(mainPath, main);
          fs.unlinkSync(onboardingPath);
          NODE

      - name: Validate build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-single/plutonium.html
          test -s dist-single/plutonium.svg
          grep -q '<!DOCTYPE html\|<html' dist-single/plutonium.html
          grep -q '<svg' dist-single/plutonium.svg
          if grep -q 'onboarding.html' dist-single/plutonium.html; then
            echo 'ERROR: generated Single-File HTML still contains a direct onboarding.html redirect.'
            exit 1
          fi
          if ! grep -q '__pluOpenEmbeddedOnboarding' dist-single/plutonium.html; then
            echo 'ERROR: embedded onboarding bridge was not injected.'
            exit 1
          fi
          printf 'HTML: '
          du -h dist-single/plutonium.html | cut -f1
          printf 'SVG:  '
          du -h dist-single/plutonium.svg | cut -f1

      - name: Upload Single-File build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plutonium-SingleFile
          path: dist-single/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-single/plutonium.html dist-single/plutonium.svg
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git commit -m "build: update Plutonium single-file outputs [skip ci]"
          git push
